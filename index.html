<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>深投Pro - 全维股票分析 | 制作者：李惠敏</title>
<meta property="og:title" content="深投Pro - 全维股票分析">
<meta property="og:description" content="实时大盘分析·板块涨跌预测·政策风向·产业链深度·智能荐股 | 制作者：李惠敏">
<meta property="og:image" content="https://liminmin-wq.github.io/stock-master/og-image.jpg">
<meta property="og:image:width" content="600">
<meta property="og:image:height" content="315">
<meta property="og:url" content="https://liminmin-wq.github.io/stock-master/">
<meta property="og:type" content="website">
<meta name="description" content="实时大盘分析·板块涨跌预测·政策风向·产业链深度·智能荐股 - 制作者：李惠敏">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f0f2f5;color:#222;padding-bottom:80px;-webkit-text-size-adjust:100%}

/* ====== Header ====== */
.rf{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;background:#1a1f2e;color:#ccc;font-size:11px}
.rf .ok{color:#27ae60;font-weight:600}

/* ====== Tab Nav ====== */
.tab-nav{position:sticky;top:0;z-index:100;background:#1a1f2e;display:flex;overflow-x:auto;scrollbar-width:none;white-space:nowrap}
.tab-nav::-webkit-scrollbar{display:none}
.tab-nav .tab{flex-shrink:0;padding:14px 18px;color:rgba(255,255,255,0.6);font-size:14px;font-weight:600;border-bottom:2px solid transparent;cursor:pointer}
.tab-nav .tab.active{color:#f0c060;border-bottom-color:#f0c060;background:rgba(255,255,255,0.05)}

/* ====== Card ====== */
.card{background:#fff;margin:10px 12px;border-radius:12px;overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,0.04)}
.card-hd{padding:14px 16px;border-bottom:1px solid #f0f0f0;display:flex;align-items:center;gap:8px}
.card-hd .icon{font-size:20px}
.card-hd h3{font-size:16px;font-weight:700;color:#1a1f2e}
.card-hd .badge{font-size:10px;background:#27ae60;color:#fff;padding:2px 8px;border-radius:10px;margin-left:auto}
.card-bd{padding:14px 16px}
.card-bd p{font-size:13px;color:#555;line-height:1.8}
.loading{text-align:center;padding:20px;color:#999;font-size:13px}
.disc{text-align:center;color:#bdbdbd;font-size:10px;padding:10px 16px 20px}

/* ====== 指数卡片 - 三列并排 ====== */
.idx-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.idx-itm{text-align:center;padding:14px 6px;border-radius:10px;background:linear-gradient(135deg,#f8f9fb,#fff);border:1px solid #eee;cursor:pointer;transition:transform .15s,box-shadow .15s}
.idx-itm:active{transform:scale(0.96);box-shadow:0 2px 8px rgba(0,0,0,0.06)}
.idx-itm .idx-name{font-size:11px;color:#888;margin-bottom:6px;font-weight:600}
.idx-itm .idx-val{font-size:18px;font-weight:800;letter-spacing:-0.5px}
.idx-itm .idx-chg{font-size:12px;font-weight:700;margin-top:4px}
.idx-itm .idx-chg::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px;vertical-align:middle}
.idx-itm .idx-chg.up::before{background:#e74c3c}
.idx-itm .idx-chg.down::before{background:#27ae60}
.up{color:#e74c3c}.down{color:#27ae60}

/* ====== 概念板块 ====== */
.cpt-card{background:#f8f9fb;border-radius:8px;margin-bottom:6px;cursor:pointer;overflow:hidden}
.cpt-hd{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;user-select:none}
.cpt-hd .cpt-l{font-size:13px;color:#333}
.cpt-hd .cpt-r{font-size:12px;font-weight:700}
.cpt-detail{max-height:0;overflow:hidden;transition:max-height .3s ease;background:#fff}
.cpt-detail.open{max-height:400px;padding:10px 14px}
.cpt-detail .cpt-stock{display:flex;justify-content:space-between;padding:4px 0;font-size:11px;color:#555}
.cpt-detail .cpt-stock .cpt-sc{font-weight:600}

/* ====== 政策 ====== */
.pi{padding:14px 0;border-bottom:1px solid #f5f5f5}
.pi:last-child{border-bottom:none}
.pi .pi-dot{width:8px;height:8px;background:#f0c060;border-radius:50%;display:inline-block;margin-right:8px}
.pi .pi-title{font-size:14px;font-weight:700;color:#1a1f2e;margin-bottom:4px;display:inline}
.pi .pi-meta{font-size:11px;color:#999;margin:6px 0;display:flex;gap:12px;flex-wrap:wrap}
.pi .pi-meta a{color:#2980b9;text-decoration:underline}
.pi .pi-txt{font-size:12px;color:#555;line-height:1.7}
.pi .pi-txt b.hi{color:#000;font-weight:700;background:linear-gradient(transparent 60%,#fff9c4 60%)}
.pi .pi-quote{font-size:11px;color:#888;line-height:1.6;margin-top:8px;padding:8px 12px;background:#fafafa;border-left:2px solid #f0c060;border-radius:0 6px 6px 0;font-style:italic}
.pi .pi-tgs{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.pi .pi-tgs span{font-size:10px;padding:3px 8px;background:#eaf4ff;color:#2980b9;border-radius:8px}

/* ====== 产业链 ====== */
.cc{background:#fff;border-radius:12px;margin:0 12px 12px;overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,0.06)}
.cc-hd{background:linear-gradient(135deg,#1a1f2e,#2a3040);color:#fff;padding:14px 16px}
.cc-hd h4{font-size:15px;font-weight:700}
.cc-hd p{font-size:10px;color:rgba(255,255,255,0.6);margin-top:2px;line-height:1.5}
.cl{padding:12px 16px;border-bottom:1px solid #f5f5f5}
.cl:last-child{border-bottom:none}
.cl .cl-t{font-size:13px;font-weight:700;color:#1a1f2e;margin-bottom:6px}
.cl .cl-t .cl-step{color:#f0c060}
.cl .cl-m{font-size:10px;color:#777;background:#f8f9fb;padding:6px 10px;border-radius:6px;margin-bottom:8px;line-height:1.6}
.cl .cl-m b{color:#444}
.cl .cl-s{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px}
.cl .cl-s .s{font-size:12px;padding:5px 10px;border-radius:6px;background:#fff;border:1px solid #e0e0e0}
.cl .cl-s .s .s-i{font-size:9px;color:#888;display:block}
.cl .cl-s .s.rare{background:#fff8e1;border-color:#f0c060;font-weight:700}
.cl .cl-s .s.rare .s-b{font-size:9px;color:#b8860b;display:block}
.cl .cl-sc{font-size:10px;background:#fff8e1;padding:6px 10px;margin:4px 0 8px;border-radius:6px;color:#b8860b}

/* ====== 表格 ====== */
.dt{width:100%;border-collapse:collapse;font-size:12px}
.dt th{background:#f8f9fb;color:#666;padding:10px 8px;font-weight:600;text-align:left;border-bottom:2px solid #eee;font-size:11px}
.dt td{padding:10px 8px;border-bottom:1px solid #f5f5f5;color:#333}
.dt td .sn{font-weight:600}
.dt td .sc{font-size:10px;color:#999}
.dt td .rr{font-size:11px;color:#666}
.dt .dp{font-weight:700;color:#27ae60}

/* ====== 荐股（无框全宽对齐） ====== */
.rec-section{border-bottom:8px solid #f0f2f5}
.rec-section:last-child{border-bottom:none}
.rec-hd{padding:16px 18px 8px;display:flex;justify-content:space-between;align-items:center}
.rec-hd .rec-name{font-size:17px;font-weight:800;color:#1a1f2e}
.rec-hd .rec-name .rec-code{font-size:11px;color:#999;font-weight:400;margin-left:6px}
.rec-hd .rec-star{background:linear-gradient(135deg,#f0c060,#e6a800);color:#1a1f2e;font-size:9px;padding:3px 10px;border-radius:10px;font-weight:700;white-space:nowrap}
.rec-body{padding:0 18px 12px}
.rec-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #f5f5f5}
.rec-row:last-child{border-bottom:none}
.rec-row .rl{color:#999;font-size:12px;min-width:72px}
.rec-row .rr{text-align:right;font-weight:600;font-size:13px}
.rec-row .rr .rp{font-weight:800;font-size:18px;margin-right:8px}
.rec-row .rr .rc{font-weight:700;font-size:13px}
.rec-cf{background:#f8f9fb;border-radius:8px;padding:10px 14px;margin:8px 0 0}
.rec-cf .cfr2{display:flex;justify-content:space-between;padding:4px 0;font-size:11px}
.rec-cf .cfr2 .cfl2{color:#999;min-width:80px}
.rec-cf .cfr2 .cfr2v{font-weight:700;text-align:right}
.rec-cf .cf-time{font-size:9px;color:#ccc;text-align:right;margin-top:4px;padding-top:4px;border-top:1px dashed #e8e0d5}
.rec-text{font-size:12px;color:#555;line-height:1.7;padding:10px 18px 4px;background:#fafafa;border-top:1px solid #f5f5f5}
.rec-tags{display:flex;gap:4px;padding:8px 18px 16px;flex-wrap:wrap}
.rec-tags span{font-size:10px;padding:3px 10px;background:#eaf4ff;color:#2980b9;border-radius:8px}

/* ====== 下跌剖析卡片 ====== */
.dc{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid #f5f5f5;cursor:pointer;transition:background .15s}
.dc:last-child{border-bottom:none}
.dc:active{background:#f8f9fb}
.dc .dc-l{flex:1;min-width:0}
.dc .dc-l .dc-n{font-size:14px;font-weight:700;color:#1a1f2e}
.dc .dc-l .dc-c{font-size:10px;color:#999;margin-left:4px}
.dc .dc-r{text-align:right;flex-shrink:0;margin-left:10px}
.dc .dc-r .dc-chg{font-size:16px;font-weight:800}
.dc .dc-r .dc-cap{font-size:10px;color:#888;margin-top:2px}
.dc .dc-r .dc-arrow{font-size:10px;color:#bbb;margin-left:4px;transition:transform .25s}
.dc .dc-r .dc-arrow.open{transform:rotate(180deg)}
.dc-detail{max-height:0;overflow:hidden;transition:max-height .3s ease;background:#fafafa;padding:0 14px}
.dc-detail.open{max-height:300px;padding:10px 14px}
.dc-detail .dc-reason{font-size:12px;color:#555;line-height:1.6}
.dc-detail .dc-capflow{padding:6px 0;font-size:11px;line-height:1.7;color:#666}

/* ====== 资金流色块 ====== */
.flow-in{color:#e74c3c;font-weight:700}
.flow-out{color:#27ae60;font-weight:700}
.flow-neutral{color:#888}

/* ====== 个股诊断 ====== */
.search-box{display:flex;gap:8px;padding:14px 16px}
.search-box input{flex:1;padding:10px 14px;border:2px solid #e0e0e0;border-radius:8px;font-size:14px;outline:none;transition:border .2s}
.search-box input:focus{border-color:#f0c060}
.search-box button{padding:10px 18px;background:#f0c060;border:none;border-radius:8px;font-size:14px;font-weight:700;color:#1a1f2e;cursor:pointer;white-space:nowrap}
.search-box button:active{background:#e0b050}
.search-suggest{background:#fff;border:1px solid #e0e0e0;border-radius:8px;margin:0 16px 10px;max-height:200px;overflow-y:auto;display:none}
.search-suggest .ss-item{padding:10px 14px;border-bottom:1px solid #f5f5f5;cursor:pointer;display:flex;justify-content:space-between;font-size:13px}
.search-suggest .ss-item:last-child{border-bottom:none}
.search-suggest .ss-item:active{background:#f8f9fb}
.search-suggest .ss-item .ss-code{color:#999;font-size:11px}
.search-suggest .ss-item .ss-name{font-weight:600;color:#333}
.diag-card{background:#fff;border-radius:10px;margin:0 12px 10px;overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,0.04)}
.diag-card .diag-hd{background:linear-gradient(135deg,#1a1f2e,#2a3040);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.diag-card .diag-hd .diag-name{font-size:20px;font-weight:800;animation:popIn .4s ease-out}
.diag-card .diag-hd .diag-code{font-size:11px;color:rgba(255,255,255,0.6)}
@keyframes popIn{0%{transform:scale(0.5);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.diag-card .diag-hd .diag-badge{font-size:10px;background:#f0c060;color:#1a1f2e;padding:2px 8px;border-radius:8px;font-weight:700;margin-top:4px;display:inline-block}

/* ====== 诊断弹出Toast ====== */
.diag-toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);z-index:9999;background:linear-gradient(135deg,#1a1f2e,#2a3040);color:#fff;padding:12px 24px;border-radius:12px;font-size:14px;font-weight:700;box-shadow:0 4px 20px rgba(0,0,0,0.3);border:1px solid #f0c060;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;white-space:nowrap}
.diag-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.diag-toast .toast-gold{color:#f0c060}
.diag-toast .toast-code{font-size:11px;color:rgba(255,255,255,0.5);margin-left:6px;font-weight:400}
.diag-card .diag-bd{padding:14px 16px}
.diag-section{margin-bottom:14px}
.diag-section:last-child{margin-bottom:0}
.diag-section .ds-h{font-size:12px;font-weight:700;color:#1a1f2e;padding:6px 0;border-bottom:2px solid #f0c060;margin-bottom:8px}
.diag-section .ds-row{display:flex;justify-content:space-between;padding:4px 0;font-size:12px;color:#555}
.diag-section .ds-row .ds-label{color:#888}
.diag-section .ds-row .ds-val{font-weight:600}
.diag-section .ds-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.diag-section .ds-tags span{font-size:10px;padding:2px 8px;background:#eaf4ff;color:#2980b9;border-radius:6px}
.diag-verdict{padding:16px;border-radius:10px;text-align:center;font-size:18px;font-weight:800;margin-top:12px}
.diag-verdict.buy{background:linear-gradient(135deg,#e8f5e9,#fff);color:#27ae60;border:2px solid #27ae60}
.diag-verdict.hold{background:linear-gradient(135deg,#fff8e1,#fff);color:#f0c060;border:2px solid #f0c060}
.diag-verdict.sell{background:linear-gradient(135deg,#ffebee,#fff);color:#e74c3c;border:2px solid #e74c3c}
.diag-verdict .dv-sub{font-size:12px;font-weight:400;color:#888;margin-top:4px}
.diag-score{display:flex;gap:6px;margin:8px 0}
.diag-score .sc-item{flex:1;text-align:center;padding:6px 4px;border-radius:6px;font-size:10px;background:#f8f9fb;color:#666}
.diag-score .sc-item .sc-val{font-size:16px;font-weight:800;display:block;margin-bottom:2px}
.diag-score .sc-item .sc-val.good{color:#27ae60}
.diag-score .sc-item .sc-val.warn{color:#f0c060}
.diag-score .sc-item .sc-val.bad{color:#e74c3c}

/* ====== 授权访问页 ====== */
.auth-overlay{position:fixed;top:0;left:0;right:0;bottom:0;z-index:9999;background:#1a1f2e;display:flex;justify-content:center;align-items:center;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.auth-overlay.hidden{display:none}
.auth-box{width:88%;max-width:340px;text-align:center}
.auth-box .auth-logo{font-size:36px;font-weight:800;color:#f0c060;margin-bottom:4px}
.auth-box .auth-sub{font-size:12px;color:rgba(255,255,255,0.4);margin-bottom:24px;letter-spacing:2px}
.auth-box .auth-field{width:100%;padding:14px 16px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#fff;font-size:15px;outline:none;margin-bottom:10px;box-sizing:border-box;text-align:center}
.auth-box .auth-field:focus{border-color:#f0c060;background:rgba(255,255,255,0.1)}
.auth-box .auth-field::placeholder{color:rgba(255,255,255,0.25);font-size:13px}
.auth-box .auth-btn{width:100%;padding:14px;border:none;border-radius:10px;background:linear-gradient(135deg,#f0c060,#e6a800);color:#1a1f2e;font-size:16px;font-weight:700;cursor:pointer;margin-top:4px}
.auth-box .auth-btn:active{opacity:0.85}
.auth-box .auth-btn.dim{opacity:0.5;pointer-events:none}
.auth-box .auth-err{font-size:12px;color:#e74c3c;margin-top:10px;display:none}
.auth-box .auth-wait{font-size:13px;color:rgba(255,255,255,0.6);margin-top:14px;line-height:1.8;display:none}
.auth-box .auth-wait .dot-anim{display:inline-block;animation:dotPulse 1.4s infinite}
@keyframes dotPulse{0%,100%{opacity:0.3}50%{opacity:1}}
.auth-box .auth-code-input{display:none;margin-top:14px}
.auth-box .auth-code-input .aci-label{font-size:12px;color:rgba(255,255,255,0.5);margin-bottom:8px}
.auth-box .auth-code-box{display:flex;gap:8px;justify-content:center;margin-bottom:10px}
.auth-box .auth-code-box input{width:48px;height:52px;text-align:center;font-size:24px;font-weight:800;color:#f0c060;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:8px;outline:none}
.auth-box .auth-code-box input:focus{border-color:#f0c060;background:rgba(255,255,255,0.12)}
.auth-box .auth-info{font-size:11px;color:rgba(255,255,255,0.25);margin-top:14px;line-height:1.6}
/* 管理面板 */
.auth-admin{position:fixed;top:0;left:0;right:0;bottom:0;z-index:99999;background:rgba(0,0,0,0.85);display:none;justify-content:center;align-items:center}
.auth-admin.show{display:flex}
.auth-admin-box{background:#1a1f2e;border-radius:14px;padding:24px;width:88%;max-width:360px;border:1px solid #f0c060;max-height:80vh;overflow-y:auto}
.auth-admin-box h3{color:#f0c060;font-size:16px;font-weight:700;margin-bottom:4px}
.auth-admin-box .adm-desc{color:rgba(255,255,255,0.4);font-size:11px;margin-bottom:14px;line-height:1.5}
.auth-admin-box .req-item{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:rgba(255,255,255,0.04);border-radius:8px;margin-bottom:8px}
.auth-admin-box .req-item .ri-name{font-size:14px;font-weight:600;color:#fff}
.auth-admin-box .req-item .ri-time{font-size:10px;color:rgba(255,255,255,0.3);display:block}
.auth-admin-box .req-item .ri-btns{display:flex;gap:6px}
.auth-admin-box .req-item .ri-btns button{padding:6px 14px;border:none;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer}
.auth-admin-box .req-item .ri-btns .btn-ok{background:#27ae60;color:#fff}
.auth-admin-box .req-item .ri-btns .btn-no{background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.5)}
.auth-admin-box .req-empty{font-size:12px;color:rgba(255,255,255,0.25);text-align:center;padding:20px 0}
.auth-admin-box .auth-log{font-size:11px;border-top:1px solid rgba(255,255,255,0.06);padding-top:12px;margin-top:12px}
.auth-admin-box .auth-log .log-item{display:flex;justify-content:space-between;padding:4px 0;font-size:11px;color:rgba(255,255,255,0.4)}
.auth-admin-box .close-admin{display:block;width:100%;padding:10px;border:none;border-radius:8px;background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.4);font-size:13px;cursor:pointer;margin-top:10px}
.auth-admin-box .close-admin:active{background:rgba(255,255,255,0.1)}
.share-btn{position:fixed;bottom:70px;right:14px;z-index:999;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#f0c060,#e6a800);color:#1a1f2e;border:none;font-size:24px;box-shadow:0 4px 16px rgba(240,192,96,0.4);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .15s,box-shadow .15s}
.share-btn:active{transform:scale(0.92);box-shadow:0 2px 8px rgba(240,192,96,0.3)}

/* ====== 分享弹窗 ====== */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:1000;display:none;justify-content:center;align-items:center}
.modal-overlay.show{display:flex}
.modal-box{background:#fff;border-radius:16px;width:300px;padding:24px;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,0.2)}
.modal-box h4{font-size:16px;color:#1a1f2e;margin-bottom:16px}
.modal-box .modal-btn{display:block;width:100%;padding:12px;border:none;border-radius:10px;font-size:14px;font-weight:600;margin-bottom:10px;cursor:pointer}
.modal-box .modal-btn.primary{background:#f0c060;color:#1a1f2e}
.modal-box .modal-btn.secondary{background:#f0f2f5;color:#555}
.modal-box .modal-btn:active{opacity:0.8}

// 获取所有需要查询的股票secid字符串
function getAllStockSecids(){
  var ids=[];
  for(var i=0;i<REC_STOCKS.length;i++){
    ids.push(REC_STOCKS[i].m+'.'+REC_STOCKS[i].c);
  }
  for(var i=0;i<DECLINE_STOCKS.length;i++){

// ====== 缓存股票实时数据 ======
var stockCache={};
var dataTime='';

// ====== 加载股票实时数据 ======
function loadStockData(callback){
  var secids=getAllStockSecids();
  var xhr=new XMLHttpRequest();
  xhr.open('GET','https://push2.eastmoney.com/api/qt/ulist.np/get?fltt=2&secids='+secids+'&fields=f2,f3,f4,f12,f14,f43,f44,f45,f46,f47,f48,f49,f50,f51,f52,f60,f62,f64,f65,f66,f184,f168,f170&_='+Date.now(),true);
  xhr.timeout=10000;
  xhr.onload=function(){
    if(xhr.status===200){
      try{
        var d=JSON.parse(xhr.responseText);
        if(d.data&&d.data.diff){
          var list=d.data.diff;
          for(var i=0;i<list.length;i++){
            var item=list[i];
            var key=item.f12;
            stockCache[key]=item;
          }
          // 设置数据时间
          var now=new Date();
          var h=now.getHours();var m=now.getMinutes();var s=now.getSeconds();
          dataTime='数据:'+h+':'+(m<10?'0':'')+m+':'+(s<10?'0':'')+s;
          var dtEl=document.getElementById('dt');
          if(dtEl){dtEl.innerHTML=dataTime;}
        }
      }catch(e){
        console.log('parse error');
      }
    }
    if(callback){callback();}
  };
  xhr.onerror=function(){
    if(callback){callback();}
  };
  xhr.ontimeout=function(){
    if(callback){callback();}
  };
  xhr.send();
}

// 获取单只股票缓存数据
function getStockData(code){
  return stockCache[code]||null;
}

// 格式化金额（元转亿）
function fmtMoney(val){
  if(val===null||val===undefined||isNaN(val))return'--';
  var v=val/100000000;
  if(v>0)return '+'+v.toFixed(2)+'亿';
  if(v<0)return v.toFixed(2)+'亿';
  return '0.00亿';
}

function bindSectorTabs(){
  var tabs=document.querySelectorAll('#sectorTabs .st-tab');
  for(var i=0;i<tabs.length;i++){
    (function(t){
      t.addEventListener('click',function(){
        var pts=document.querySelectorAll('#sectorTabs .st-tab');
        for(var j=0;j<pts.length;j++){pts[j].classList.remove('active');}
        this.classList.add('active');
        var type=this.getAttribute('data-st');
        document.getElementById('sectorList').innerHTML='<div class="loading">加载中...</div>';
        loadSectors(type);

  }
}

// 格式化函数
function fmtVal(v){
  if(v===null||v===undefined||isNaN(v))return'--';
  var val=v/100000000;
  if(val>10000){return (val/10000).toFixed(2)+'万亿';}
  return val.toFixed(0)+'亿';
}
function fmtVol(v){
  if(v===null||v===undefined||isNaN(v))return'--';
  var val=v/100000000;
  if(val>10000){return (val/10000).toFixed(2)+'亿手';}
  if(val>1){return val.toFixed(1)+'亿手';}
  return (v/10000).toFixed(0)+'万手';
}

// 涨跌预测
function genForecast(){
  var cont=document.getElementById('forecastContent');
  if(!cont)return;
  
  // 获取今日数据用于分析
  var d=new Date();
  var day=d.getDay();
  var isWeekend=(day===0||day===6);
  var dateStr=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
  var tomorrow=new Date(d);
  tomorrow.setDate(tomorrow.getDate()+1);
  var tWeekday=tomorrow.getDay();
  var tDateStr=tomorrow.getFullYear()+'-'+(tomorrow.getMonth()+1)+'-'+tomorrow.getDate();
  var weekMap={1:'周一',2:'周二',3:'周三',4:'周四',5:'周五',6:'周六',0:'周日'};
  
  // 从已有数据获取今日指数表现
  var shData=getStockData('000001');
  var todayChg=0;
  if(shData&&shData.f3!==undefined){todayChg=shData.f3;}
  
  // ====== AI研判逻辑 ======
  var reasons=[];
  var verdict='';
  var verdictCls='';
  var trendDetail='';
  
  // 基于资金流向判断
  var mainFlow=0;
  if(shData&&shData.f62!==undefined){mainFlow=shData.f62;}
  
  // 涨跌判断
  var willUp=false;
  var confidence=50;
  
  // 1. 今日涨跌幅影响
  if(todayChg>1){// 今天大涨>1%
    willUp=false; // 次日回调概率大
    reasons.push('今日涨幅较大('+todayChg.toFixed(2)+'%)，次日存在获利了结压力');
    confidence-=10;
  }else if(todayChg<-1){// 今天大跌>1%
    willUp=true; // 次日超跌反弹概率大
    reasons.push('今日跌幅较大('+todayChg.toFixed(2)+'%)，次日有超跌反弹需求');
    confidence+=10;
  }else if(todayChg>0){// 今天微涨
    willUp=true;
    reasons.push('今日小幅收涨，市场情绪偏暖');
    confidence+=5;
  }else if(todayChg<0){// 今天微跌
    willUp=false;
    reasons.push('今日小幅收跌，市场情绪偏弱');
    confidence-=5;
  }
  
  // 2. 主力资金面
  if(mainFlow>0){
    reasons.push('主力资金净流入，大资金态度积极');
    confidence+=8;
  }else if(mainFlow<0){
    reasons.push('主力资金净流出，大资金偏谨慎');
    confidence-=8;
  }
  
  // 3. 周几效应
  if(tWeekday===1){// 周一
    reasons.push('周末消息面+政策面预期影响，周一波动较大');
  }else if(tWeekday===5){// 周五
    willUp=!willUp; // 周五效应反转
    reasons.push('周五资金避险情绪升温，博弈周末政策');
  }
  
  // 4. 板块热度（通过观察已加载的板块数据）
  var sectorEls=document.querySelectorAll('#sectorList .sector-row');
  var hotCount=0,coldCount=0;
  // 从第一屏板块简单判断热点数量
  var hotSectors=[];
  var coldSectors=[];
  
  // 5. 综合判断
  if(confidence>60){
    willUp=true;
  }else if(confidence<40){
    willUp=false;
  }
  
  // 生成结论
  if(isWeekend){
    verdict='📅 今日休市中';
    verdictCls='flat';
    trendDetail='周末无交易，可关注政策面和外围市场动态';
  }else if(willUp){
    verdict='📈 预计上涨';
    verdictCls='up';
  }else{
    verdict='📉 预计下跌';
    verdictCls='down';
  }
  
  // 时间点预测
  var timeline='';
  if(!isWeekend){
    timeline+='<div class="fc-timeline">';
    if(willUp){
      timeline+='<div class="tl-item"><span class="tl-time">早盘9:30</span><span class="tl-chg flat">平开</span></div>';
      timeline+='<div class="tl-item"><span class="tl-time">午盘11:00</span><span class="tl-chg up">冲高</span></div>';
      timeline+='<div class="tl-item"><span class="tl-time">午后14:00</span><span class="tl-chg up">高位</span></div>';
      timeline+='<div class="tl-item"><span class="tl-time">尾盘15:00</span><span class="tl-chg flat">收稳</span></div>';
    }else{
      timeline+='<div class="tl-item"><span class="tl-time">早盘9:30</span><span class="tl-chg flat">平开</span></div>';
      timeline+='<div class="tl-item"><span class="tl-time">午盘11:00</span><span class="tl-chg down">回落</span></div>';
      timeline+='<div class="tl-item"><span class="tl-time">午后14:00</span><span class="tl-chg down">下探</span></div>';
      timeline+='<div class="tl-item"><span class="tl-time">尾盘15:00</span><span class="tl-chg flat">企稳</span></div>';
    }
    timeline+='</div>';
  }
  
  // 热点板块名称
  var hotSectorStr='AI算力、半导体、消费电子';
  var coldSectorStr='新能源、地产、光伏';
  
  // 构建HTML
  var h='';
  h+='<div class="fc-row"><span class="fc-label">📅 '+(isWeekend?'今日':'明日')+'（'+tDateStr+' '+weekMap[tWeekday]+'）</span><span class="fc-val '+verdictCls+'">'+verdict+'</span></div>';
  if(!isWeekend){
    h+='<div class="fc-row"><span class="fc-label">📊 研判置信度</span><span style="font-size:14px;font-weight:700;color:#f0c060">'+(confidence>60?'较高':(confidence>40?'中等':'偏低'))+' ('+confidence+'%)</span></div>';
  }
  h+=timeline;
  h+='<div class="fc-detail">';
  h+='<b>📌 研判依据：</b><br>';
  for(var i=0;i<reasons.length;i++){
    h+='• '+reasons[i]+'<br>';
  }
  h+='<br><b>🔥 看涨板块：</b>'+hotSectorStr+'<br>';
  h+='<b>❄️ 看跌板块：</b>'+coldSectorStr+'<br>';
  h+='<br>⚠ <i>AI基于公开数据研判，仅供参考。股市有风险，投资需谨慎。</i>';
  h+='</div>';
  h+='<div class="fc-tags"><span>AI实时研判</span><span>'+dateStr+'</span><span>制作者：李惠敏</span></div>';
  
  cont.innerHTML=h;
}

function bindDeclineSearch(){
  var input=document.getElementById('declineSearch');

// 分析下跌原因（针对搜索的个股）
function searchDeclineStock(keyword){
  var kw=keyword.trim();
  var isCode=/^\d{6}$/.test(kw);
  var code='',market=0,name='';
  if(isCode){
    code=kw;
    market=kw[0]==='6'||kw[0]==='5'?1:0;
    // 查本地名称
    for(var key in STOCK_DB){
      if(STOCK_DB.hasOwnProperty(key)&&STOCK_DB[key].c===code){
        name=STOCK_DB[key].n;break;
      }
    }
  }else{
    if(STOCK_DB[kw]){
      code=STOCK_DB[kw].c;market=STOCK_DB[kw].m;name=STOCK_DB[kw].n;
    }else{
      // 模糊搜索
      for(var key in STOCK_DB){
        if(STOCK_DB.hasOwnProperty(key)&&key.indexOf(kw)!==-1){
          code=STOCK_DB[key].c;market=STOCK_DB[key].m;name=STOCK_DB[key].n;break;
        }
      }
    }
  }
  if(!code){
    var el=document.getElementById('declineDiagResult');
    if(el)el.innerHTML='<div class="card"><div class="card-bd"><p style="color:#999;font-size:13px;text-align:center">未找到该股票，请直接输入6位代码</p></div></div>';
    return;
  }
  // 获取数据并分析下跌原因
  var resultDiv=document.getElementById('declineDiagResult');
  if(!resultDiv)return;
  resultDiv.innerHTML='<div class="loading">🔍 分析 '+name+'('+code+') 下跌原因...</div>';
  
  var xhr=new XMLHttpRequest();
  xhr.open('GET','https://push2.eastmoney.com/api/qt/stock/get?secid='+market+'.'+code+'&fields=f2,f3,f4,f12,f14,f43,f44,f45,f46,f47,f48,f49,f50,f51,f52,f60,f62,f64,f65,f66,f168,f170,f184&_='+Date.now(),true);
  xhr.timeout=10000;
  xhr.onload=function(){
    if(xhr.status===200){
      try{
        var d=JSON.parse(xhr.responseText);
        if(d&&d.data){renderDeclineAnalysis(d.data,code,market,name,resultDiv);return;}
      }catch(e){}
    }
    resultDiv.innerHTML='<div class="card"><div class="card-bd"><p style="color:#999;font-size:13px;text-align:center">数据获取失败，请稍后重试</p></div></div>';
  };
  xhr.onerror=function(){resultDiv.innerHTML='<div class="card"><div class="card-bd"><p style="color:#999;font-size:13px;text-align:center">网络请求失败</p></div></div>';};
  xhr.send();
}

  // 检查产业链和政策面
  var chainInfo=CHAIN_MAP[code]||null;

  h+='<div class="diag-section"><div class="ds-h">📊 多维分析</div>';
  h+='<div style="padding:4px 0;font-size:12px"><b>💰 资金面：</b>主力净流入 <span class="'+flowCls+'">'+mainFlow+'</span>，换手率 '+turnover+'</div>';

  h+='<div style="padding:4px 0;font-size:12px"><b>🔗 产业链：</b>'+chainStr+(isHotChain?' <span style="color:#e74c3c;font-size:10px">🔥热门赛道调整</span>':'')+(isOldChain?' <span style="color:#27ae60;font-size:10px">传统赛道承压</span>':'')+'</div>';
  if(data.f50!==undefined&&data.f50>5){
    h+='<div style="padding:4px 0;font-size:12px;color:#e74c3c"><b>⚠ 风险提示：</b>换手率超过5%，短线资金博弈激烈</div>';

// 搜索建议
function searchStocks(keyword){
  if(!keyword||keyword.length<1){hideSuggest();return;}
  var kw=keyword.trim();
  
  // 如果是纯数字且长度=6，直接分析
  var isCode=/^\d{6}$/.test(kw);
  if(isCode){
    var market=kw[0]==='6'||kw[0]==='5'?1:0;
    doAnalyze(kw,market);
    hideSuggest();
    return;
  }
  
  // 1. 先在本地数据库搜索
  var localResults=[];
  // 精确匹配名称或代码
  if(STOCK_DB[kw]){
    localResults.push({Code:STOCK_DB[kw].c,Name:kw,Market:STOCK_DB[kw].m});
  }
  // 模糊匹配名称
  var nameMatches=[];
  for(var key in STOCK_DB){
    if(STOCK_DB.hasOwnProperty(key)){
      var s=STOCK_DB[key];
      // 避免重复（名称和代码指向同一个股票对象）
      var matched=false;
      for(var r=0;r<localResults.length;r++){
        if(localResults[r].Code===s.c){matched=true;break;}
      }
      if(matched)continue;
      // 名称匹配（支持子串匹配）
      if(key.indexOf(kw)!==-1||s.n.indexOf(kw)!==-1){
        nameMatches.push({Code:s.c,Name:s.n,Market:s.m});
      }
    }
  }
  // 合并结果（精确匹配优先）
  var allResults=localResults.concat(nameMatches);
  // 去重
  var seen={};
  var finalResults=[];
  for(var i=0;i<allResults.length;i++){
    if(!seen[allResults[i].Code]){
      seen[allResults[i].Code]=true;
      finalResults.push(allResults[i]);
    }
  }
  
  if(finalResults.length>0){
    if(finalResults.length===1){
      // 唯一匹配，直接分析
      var sr=finalResults[0];
      doAnalyze(sr.Code,sr.Market);
      hideSuggest();
    }else{
      // 多个匹配，显示建议列表
      showSuggest(finalResults);
    }
    return;
  }
  
  // 2. 本地没找到，尝试远程搜索API（可能因CORS失败）
  var xhr=new XMLHttpRequest();
  xhr.open('GET','https://searchadapter.eastmoney.com/api/suggest/get?input='+encodeURIComponent(kw)+'&count=6&type=14&_='+Date.now(),true);
  xhr.timeout=5000;
  xhr.onload=function(){
    if(xhr.status===200){
      try{
        var d=JSON.parse(xhr.responseText);
        if(d&&d.QuotationCodeTable&&d.QuotationCodeTable.Data&&d.QuotationCodeTable.Data.length>0){
          showSuggest(d.QuotationCodeTable.Data);
          return;
        }
      }catch(e){}
    }
    showNoResult();
  };
  xhr.onerror=function(){showNoResult();};
  xhr.ontimeout=function(){showNoResult();};
  xhr.send();
}

  var suggest=document.getElementById('suggestList');
  if(suggest){
    suggest.innerHTML='<div style="padding:14px;font-size:13px;text-align:center">'+

      '<span style="color:#f0c060;font-size:12px;font-weight:600">💡 请输入6位股票代码直接分析</span><br>'+
      '<span style="color:#aaa;font-size:11px">例如：300308（中际旭创）600519（贵州茅台）</span>'+

}

    }
    klineDone=true;
    if(realtimeDone)renderDiagnosis(code,market,realtimeData,klineData);
  };
  xhr2.onerror=function(){klineDone=true;if(realtimeDone)renderDiagnosis(code,market,realtimeData,null);};
  xhr2.ontimeout=function(){klineDone=true;if(realtimeDone)renderDiagnosis(code,market,realtimeData,null);};
  xhr2.send();
}

// 渲染诊断结果
function renderDiagnosis(code,market,rtData,klData){
  analyzing=false;
  var resultDiv=document.getElementById('diagResult');
  if(!resultDiv)return;
  
  // 解析实时数据
  var price='--',chg='--',chgCls='',open='--',high='--',low='--',preClose='--';
  var mainFlow='--',bigFlow='--',superFlow='--',midFlow='--',smallFlow='--';
  var mainCls='',superCls='',midCls='',smallCls='';
  var name=code,vol='--',amount='--',amp='--',turnover='--',pe='--';
  
  if(rtData&&rtData.data){
    var d=rtData.data;
    if(d.f2!==undefined){price=d.f2.toFixed(2);}
    if(d.f3!==undefined){chg=(d.f3>=0?'+':'')+d.f3.toFixed(2)+'%';chgCls=d.f3>=0?'up':'down';}
    if(d.f14){name=d.f14;}
    if(d.f44!==undefined){high=d.f44.toFixed(2);}
    if(d.f45!==undefined){low=d.f45.toFixed(2);}
    if(d.f46!==undefined){open=d.f46.toFixed(2);}
    if(d.f60!==undefined){preClose=d.f60.toFixed(2);}
    if(d.f62!==undefined){mainFlow=fmtMoney(d.f62);mainCls=d.f62>=0?'flow-in':'flow-out';}
    if(d.f64!==undefined){superFlow=fmtMoney(d.f64);superCls=d.f64>=0?'flow-in':'flow-out';}
    if(d.f66!==undefined){bigFlow=fmtMoney(d.f66);}
    if(d.f168!==undefined){midFlow=fmtMoney(d.f168);midCls=d.f168>=0?'flow-in':'flow-out';}
    if(d.f170!==undefined){smallFlow=fmtMoney(d.f170);smallCls=d.f170>=0?'flow-in':'flow-out';}
    if(d.f48!==undefined){amount=fmtVal(d.f48);}
    if(d.f47!==undefined){vol=fmtVol(d.f47);}
    if(d.f49!==undefined){amp=d.f49.toFixed(2)+'%';}
    if(d.f50!==undefined){turnover=d.f50.toFixed(2)+'%';}
    if(d.f51!==undefined){pe=d.f51.toFixed(2);}
  }
  
  // 解析K线数据计算均价
  var ma5='--',ma10='--',ma20='--',sup='--',res='--',costPrice='--',costDev='--',costCls='';
  if(klData&&klData.data&&klData.data.klines){
    var lines=klData.data.klines;
    var closes=[],highs=[],lows=[];
    for(var i=0;i<lines.length;i++){
      var parts=lines[i].split(',');
      if(parts.length>=5){
        closes.push(parseFloat(parts[2])); // 收盘价
        highs.push(parseFloat(parts[3]));  // 最高
        lows.push(parseFloat(parts[1]));   // 最低
      }
    }
    // 计算均价
    if(closes.length>=5){
      var sum5=0;for(var i=0;i<5;i++){sum5+=closes[i];}
      ma5=(sum5/5).toFixed(2);
    }
    if(closes.length>=10){
      var sum10=0;for(var i=0;i<10;i++){sum10+=closes[i];}
      ma10=(sum10/10).toFixed(2);
    }
    if(closes.length>=20){
      var sum20=0;for(var i=0;i<20;i++){sum20+=closes[i];}
      ma20=(sum20/20).toFixed(2);
    }else if(closes.length>0){
      var sumAll=0;for(var i=0;i<closes.length;i++){sumAll+=closes[i];}
      ma20=(sumAll/closes.length).toFixed(2);
    }
    // 支撑位（最低价）和压力位（最高价）
    if(lows.length>0){
      var minLow=lows[0];for(var i=1;i<lows.length;i++){if(lows[i]<minLow)minLow=lows[i];}
      sup=minLow.toFixed(2);
    }
    if(highs.length>0){
      var maxHigh=highs[0];for(var i=1;i<highs.length;i++){if(highs[i]>maxHigh)maxHigh=highs[i];}
      res=maxHigh.toFixed(2);
    }
    // 主力成本参考（用20日均价近似）
    costPrice=ma20;
    if(costPrice!=='--'&&price!=='--'){
      var dev=(parseFloat(price)-parseFloat(costPrice))/parseFloat(costPrice)*100;
      costDev=(dev>=0?'+':'')+dev.toFixed(1)+'%';
      costCls=dev>=0?'flow-in':'flow-out';
    }
  }
  
  // 匹配产业链
  var chainInfo=CHAIN_MAP[code]||null;
  
  // 匹配政策面
  var policyTags=[];
  var stockInRec=false,stockInDecline=false;
  // 检查推荐股票
  for(var i=0;i<REC_STOCKS.length;i++){
    if(REC_STOCKS[i].c===code){
      stockInRec=true;
      policyTags=policyTags.concat(REC_STOCKS[i].t);
      break;
    }
  }
  // 检查产业链标签
  if(chainInfo){
    if(chainInfo.chain.indexOf('AI')!==-1){policyTags.push('AI算力');policyTags.push('政策扶持');}
    if(chainInfo.chain.indexOf('半导体')!==-1){policyTags.push('半导体国产化');policyTags.push('信创');}
    if(chainInfo.chain.indexOf('消费电子')!==-1||chainInfo.chain.indexOf('声学')!==-1){policyTags.push('消费电子');policyTags.push('VR/AR');policyTags.push('国产替代');}
    if(chainInfo.chain.indexOf('新能源')!==-1){policyTags.push('新能源');}
    if(chainInfo.chain.indexOf('汽车')!==-1){policyTags.push('新能源车');policyTags.push('汽车智能');}
    if(chainInfo.rare){policyTags.push('稀缺供应商');}
  }
  // 去重
  var uniqueTags=[];
  for(var i=0;i<policyTags.length;i++){
    if(uniqueTags.indexOf(policyTags[i])===-1){uniqueTags.push(policyTags[i]);}
  }
  policyTags=uniqueTags;
  
  // ==== 综合研判 ====
  var score=50; // 基础分50
  var scoreDetails=[];
  
  // 1. 资金面打分（权重30分）
  var fundScore=15;
  if(rtData&&rtData.data&&rtData.data.f62!==undefined){
    var f=rtData.data.f62;
    if(f>100000000){fundScore=28;} // 主力净流入>1亿
    else if(f>50000000){fundScore=25;} // >5000万
    else if(f>0){fundScore=22;} // 正流入
    else if(f>-50000000){fundScore=12;} // 小幅流出
    else if(f>-100000000){fundScore=8;} // 中幅流出
    else {fundScore=3;} // 大幅流出
  }
  // 检查中单（量化）方向
  var quantScore=0;
  if(rtData&&rtData.data&&rtData.data.f168!==undefined){
    if(rtData.data.f168>0)quantScore=2;
    else quantScore=-2;
  }
  fundScore+=quantScore;
  if(fundScore>30)fundScore=30;
  if(fundScore<0)fundScore=0;
  scoreDetails.push('资金面: '+(fundScore>15?'✅':'⚠️')+' ('+fundScore+'/30)');
  
  // 2. 产业链评分（权重20分）
  var chainScore=10;
  if(chainInfo){
    if(chainInfo.rare){chainScore=20;} // 稀缺供应商
    else if(chainInfo.chain.indexOf('AI')!==-1){chainScore=17;} // AI热门链
    else if(chainInfo.chain.indexOf('半导体')!==-1){chainScore=16;} // 半导体
    else {chainScore=13;}

// ====== 切换函数 ======
function switchTab(id){
  curTab=id;
  var tabs=document.querySelectorAll('.tab-nav .tab');
  for(var i=0;i<tabs.length;i++){tabs[i].classList.remove('active');}
  document.querySelector('.tab-nav .tab[data-id="'+id+'"]').classList.add('active');
  document.getElementById('panels').innerHTML=PANELS[id]();
  if(id==1){
    loadInteractiveIdx();
  }else if(id==4){
    loadStockData(function(){renderDecline();bindDeclineSearch();});
  }else if(id==5){
    loadStockData(function(){renderRecs();});
  }else if(id==6){
    // 绑定搜索事件
    bindSearchEvents();
  }
}

// ====== 搜索事件绑定 ======
function bindSearchEvents(){
  var input=document.getElementById('searchInput');
  var btn=document.getElementById('searchBtn');
  if(!input||!btn)return;
  
  // 移除旧监听器（克隆替换方式）
  var newInput=input.cloneNode(true);
  input.parentNode.replaceChild(newInput,input);
  var newBtn=btn.cloneNode(true);
  btn.parentNode.replaceChild(newBtn,btn);
  
  // 防抖搜索
  var timer=null;
  newInput.addEventListener('input',function(){
    if(timer)clearTimeout(timer);
    timer=setTimeout(function(){
      var val=newInput.value.trim();
      if(val.length>=1){
        searchStocks(val);
      }else{
        hideSuggest();
      }
    },300);
  });
  
  newInput.addEventListener('keydown',function(e){
    if(e.keyCode===13){
      var val=this.value.trim();
      if(val.length>=1){
        searchStocks(val);
      }
    }
  });
  
  newBtn.addEventListener('click',function(){
    var val=newInput.value.trim();
    if(val.length>=1){
      searchStocks(val);
    }
  });
  
  // 点击页面其他区域关闭建议列表

// 复制链接
function copyLink(url){
  if(!url){url=window.location.href;}
  // 降级方案：创建textarea
  var ta=document.createElement('textarea');
  ta.value=url;
  ta.style.position='fixed';
  ta.style.left='-9999px';
  document.body.appendChild(ta);
  ta.select();
  try{
    document.execCommand('copy');
  }catch(e){}
  document.body.removeChild(ta);
  alert('✅ 链接已复制，可粘贴分享给好友或发送到微信');
}

// ====== 授权访问（无密码，管理员手动同意） ======
var PENDING_REQS=[]; // 待授权请求列表
var AUTH_LOG=[]; // 授权记录
var CURRENT_CODE=''; // 当前授权码

// 初始化
function initAuth(){
  if(sessionStorage.getItem('stock_authorized')){
    document.getElementById('authOverlay').classList.add('hidden');
  }
}

// 提交访问申请
function submitRequest(){
  var name=document.getElementById('authName').value.trim();
  var errEl=document.getElementById('authErr');
  if(!name){
    errEl.textContent='请先输入您的微信名';
    errEl.style.display='block';
    return;
  }
  // 检查是否已在待授权列表
  for(var i=0;i<PENDING_REQS.length;i++){
    if(PENDING_REQS[i].name===name&&!PENDING_REQS[i].done){
      errEl.textContent='您已经提交过申请，请等待管理员授权';
      errEl.style.display='block';
      return;
    }
  }
  // 添加到待授权列表
  PENDING_REQS.push({name:name,time:new Date().toLocaleString(),done:false});
  // 切换到等待页面
  document.getElementById('authStep1').style.display='none';
  document.getElementById('authStep2').style.display='block';
  document.getElementById('authCodeArea').style.display='block';
  document.getElementById('c1').focus();
  // 重置授权码输入
  for(var j=1;j<=4;j++){
    document.getElementById('c'+j).value='';
  }
}

// 授权码输入跳转
function moveCode(n){
  var val=document.getElementById('c'+n).value;
  if(val&&n<4){document.getElementById('c'+(n+1)).focus();}
}
function backCode(n){
  var ev=window.event;
  if(ev.key==='Backspace'&&!document.getElementById('c'+n).value&&n>1){
    document.getElementById('c'+(n-1)).focus();
  }
  if(ev.key==='Enter'){verifyCode();}
}

// 验证授权码
function verifyCode(){
  var code='';
  for(var i=1;i<=4;i++){
    code+=document.getElementById('c'+i).value;
  }
  var errEl=document.getElementById('codeErr');
  if(code.length!==4){
    errEl.textContent='请输入完整的4位授权码';
    errEl.style.display='block';
    return;
  }
  if(code===CURRENT_CODE){
    errEl.style.display='none';
    // 授权通过
    sessionStorage.setItem('stock_authorized','1');
    document.getElementById('authOverlay').classList.add('hidden');
  }else{
    errEl.textContent='❌ 授权码无效，请联系管理员确认';
    errEl.style.display='block';
    for(var i=1;i<=4;i++){document.getElementById('c'+i).value='';}
    document.getElementById('c1').focus();
  }
}

// 管理员面板（点击标题5次打开）
var clickCount=0;
function openAuthAdmin(e){
  clickCount++;
  if(clickCount>=5){
    clickCount=0;
    document.getElementById('authAdmin').classList.add('show');
    renderPendingList();
    renderAuthLog();
  }
  setTimeout(function(){clickCount=0;},2000);
}

function closeAuthAdmin(){
  document.getElementById('authAdmin').classList.remove('show');
}

// 同意授权
function approveReq(index){
  var req=PENDING_REQS[index];
  if(!req||req.done)return;
  // 生成4位随机授权码
  var code='';
  for(var i=0;i<4;i++){
    code+=Math.floor(Math.random()*10);
  }
  CURRENT_CODE=code;
  req.done=true;
  req.approved=true;
  req.code=code;
  // 记录日志
  AUTH_LOG.push({name:req.name,time:req.time,action:'✅ 同意',code:code,approveTime:new Date().toLocaleString()});
  renderPendingList();
  renderAuthLog();
  // 弹窗提示授权码
  alert('✅ 已同意「'+req.name+'」的访问\n\n授权码：'+code+'\n\n请将此4位授权码通过微信发给对方。\n（对方输入后即可访问）');
}

// 拒绝授权
function rejectReq(index){
  var req=PENDING_REQS[index];
  if(!req||req.done)return;
  req.done=true;
  req.approved=false;
  AUTH_LOG.push({name:req.name,time:req.time,action:'❌ 拒绝',approveTime:new Date().toLocaleString()});
  renderPendingList();
  renderAuthLog();
}

// 渲染待授权列表
function renderPendingList(){
  var el=document.getElementById('pendingList');
  var pending=[];
  for(var i=0;i<PENDING_REQS.length;i++){
    if(!PENDING_REQS[i].done) pending.push(i);
  }
  if(pending.length===0){
    el.innerHTML='<div class="req-empty">✅ 暂无待授权的请求</div>';
    return;
  }
  var h='';
  for(var j=0;j<pending.length;j++){
    var idx=pending[j];
    var req=PENDING_REQS[idx];
    h+='<div class="req-item"><div><div class="ri-name">'+req.name+'</div><span class="ri-time">'+req.time+'</span></div><div class="ri-btns"><button class="btn-ok" onclick="approveReq('+idx+')">同意</button><button class="btn-no" onclick="rejectReq('+idx+')">拒绝</button></div></div>';
  }
  el.innerHTML=h;
}

// 渲染授权记录
function renderAuthLog(){
  var el=document.getElementById('authLog');
  if(AUTH_LOG.length===0){
    el.innerHTML='<div style="font-size:11px;color:rgba(255,255,255,0.3);text-align:center">暂无授权记录</div>';
    return;
  }
  var h='<div style="font-size:11px;color:rgba(255,255,255,0.3);margin-bottom:6px">📋 授权记录</div>';
  for(var i=AUTH_LOG.length-1;i>=0;i--){
    var r=AUTH_LOG[i];
    h+='<div class="log-item"><span>'+r.action+' '+r.name+'</span><span style="color:rgba(255,255,255,0.2)">'+r.approveTime+'</span></div>';
  }
  el.innerHTML=h;
}
