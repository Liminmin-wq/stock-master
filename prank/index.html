<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#0a0a0f;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:'PingFang SC','Microsoft YaHei',sans-serif;
  overflow:hidden;
  position:relative;
}

/* 背景粒子 */
.bg-particles{
  position:fixed;
  top:0;left:0;width:100%;height:100%;
  pointer-events:none;
  z-index:0;
  overflow:hidden;
}
.bg-particles span{
  position:absolute;
  width:4px;height:4px;
  background:rgba(255,60,60,0.3);
  border-radius:50%;
  animation:float linear infinite;
}
@keyframes float{
  0%{transform:translateY(100vh) scale(0);opacity:0}
  10%{opacity:1}
  90%{opacity:1}
  100%{transform:translateY(-10vh) scale(1);opacity:0}
}

/* 第一阶段：伪装加载 */
#stageFake{
  position:fixed;
  top:0;left:0;width:100%;height:100%;
  z-index:10;
  background:#0a0a0f;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  transition:opacity .6s ease,transform .6s ease;
}
.fake-icon{
  width:64px;height:64px;
  border:3px solid #2a2a3a;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  color:#666;
  margin-bottom:20px;
  animation:pulse 1.5s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{opacity:.5;transform:scale(1)}
  50%{opacity:1;transform:scale(1.05)}
}
.fake-title{color:#888;font-size:16px;margin-bottom:6px}
.fake-sub{color:#555;font-size:13px;margin-bottom:30px}
.fake-bar{
  width:200px;height:3px;
  background:#1a1a2a;
  border-radius:2px;
  overflow:hidden;
}
.fake-bar-inner{
  height:100%;width:0%;
  background:linear-gradient(90deg,#e74c3c,#ff6b6b);
  border-radius:2px;
  animation:loading 1.8s ease-in-out forwards;
}
@keyframes loading{
  0%{width:0%}
  60%{width:72%}
  85%{width:88%}
  100%{width:100%}
}

/* 第二阶段：主内容 */
#stageMain{
  position:fixed;
  top:0;left:0;width:100%;height:100%;
  z-index:5;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:30px;
}
#stageMain.show{
  display:flex;
}

/* 内容卡片 */
.prank-card{
  position:relative;
  max-width:520px;
  width:100%;
  background:linear-gradient(145deg,#120e0e,#1a1215,#0f0a0a);
  border:1px solid rgba(255,60,60,0.15);
  border-radius:20px;
  padding:50px 30px 40px;
  text-align:center;
  box-shadow:
    0 0 60px rgba(255,0,0,0.08),
    inset 0 0 60px rgba(255,0,0,0.02);
  opacity:0;
  transform:scale(0.7) rotateX(20deg);
  transition:all .8s cubic-bezier(.34,1.56,.64,1);
}
.prank-card.show{
  opacity:1;
  transform:scale(1) rotateX(0deg);
}

/* 顶部装饰 */
.prank-badge{
  display:inline-block;
  padding:4px 16px;
  background:linear-gradient(90deg,#e74c3c,#c0392b);
  color:#fff;
  font-size:11px;
  letter-spacing:4px;
  border-radius:20px;
  margin-bottom:20px;
  opacity:0;
  animation:fadeIn .6s 1.5s forwards;
}
@keyframes fadeIn{to{opacity:1}}

/* 大标题 - 骂人话 */
.roast-text{
  font-size:28px;
  font-weight:700;
  line-height:1.5;
  color:#ff4757;
  letter-spacing:1px;
  text-shadow:0 0 30px rgba(255,71,87,0.3);
  margin-bottom:16px;
  min-height:1.5em;
  opacity:0;
  animation:roastIn .8s 1.8s forwards;
}
@keyframes roastIn{
  0%{opacity:0;transform:translateY(20px) scale(0.9);filter:blur(8px)}
  100%{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}
}
.roast-text.small{font-size:22px}
.roast-text.large{font-size:32px}

/* 副标题装饰 */
.roast-sub{
  color:#666;
  font-size:14px;
  margin-bottom:30px;
  opacity:0;
  animation:fadeIn .6s 2.5s forwards;
}
.roast-sub span{color:#ff4757}

/* 统计信息 */
.prank-stats{
  display:flex;
  justify-content:center;
  gap:24px;
  margin-bottom:28px;
  opacity:0;
  animation:fadeIn .6s 2.8s forwards;
}
.stat-item{
  text-align:center;
}
.stat-num{
  font-size:24px;
  font-weight:700;
  color:#ff4757;
}
.stat-label{
  font-size:11px;
  color:#555;
  margin-top:2px;
}

/* 底部按钮 */
.prank-footer{
  opacity:0;
  animation:fadeIn .6s 3.2s forwards;
}
.prank-btn{
  display:inline-block;
  padding:10px 28px;
  background:linear-gradient(90deg,#2a1a1a,#3a2020);
  color:#ff6b6b;
  border:1px solid rgba(255,60,60,0.2);
  border-radius:10px;
  font-size:13px;
  cursor:pointer;
  transition:all .3s;
  text-decoration:none;
  -webkit-tap-highlight-color:transparent;
}
.prank-btn:active{transform:scale(0.95);background:#3a2020}

/* 落款 */
.prank-sign{
  margin-top:24px;
  font-size:11px;
  color:#333;
  letter-spacing:1px;
}

/* 震动效果 */
@keyframes shake{
  0%,100%{transform:translateX(0)}
  10%{transform:translateX(-4px) rotate(-1deg)}
  20%{transform:translateX(4px) rotate(1deg)}
  30%{transform:translateX(-4px)}
  40%{transform:translateX(4px)}
  50%{transform:translateX(-2px)}
  60%{transform:translateX(2px)}
  70%{transform:translateX(-1px)}
}
.shake{animation:shake .5s ease-in-out}

/* 屏幕闪烁 */
@keyframes flash{
  0%{background:#0a0a0f}
  25%{background:#1a0505}
  50%{background:#0a0a0f}
  75%{background:#150808}
  100%{background:#0a0a0f}
}
.flash-bg{animation:flash .3s ease 1.2s 3}

/* 第二次访问提示 */
.return-tag{
  position:absolute;
  top:12px;
  right:12px;
  background:rgba(255,60,60,0.1);
  color:#ff4757;
  font-size:10px;
  padding:2px 10px;
  border-radius:10px;
  border:1px solid rgba(255,60,60,0.15);
  opacity:0;
}
.return-tag.show{opacity:1}

/* 防手机滑动误触 */
body.trapped{
  position:fixed;
  width:100%;
  height:100%;
  overflow:hidden;
  touch-action:none;
  -webkit-overflow-scrolling:auto;
}

/* 响应式 */
@media(max-width:480px){
  .prank-card{padding:40px 20px 30px;border-radius:16px}
  .roast-text{font-size:24px}
  .roast-text.small{font-size:19px}
  .roast-text.large{font-size:28px}
  .prank-stats{gap:16px}
}
</style>

// 🚀 运行逻辑
// ============================================

var totalRoasts = ROASTS.length;

// 生成粒子背景
function createParticles(){
  var c = document.getElementById('particles');
  for(var i=0;i<50;i++){
    var s = document.createElement('span');
    s.style.left = Math.random()*100+'%';
    s.style.width = s.style.height = (2+Math.random()*4)+'px';
    s.style.animationDuration = (8+Math.random()*20)+'s';
    s.style.animationDelay = (Math.random()*10)+'s';
    s.style.opacity = 0.1 + Math.random()*0.3;
    c.appendChild(s);
  }
}
createParticles();

// 获取随机骂人话
function getRandomRoast(except){
  var idx = Math.floor(Math.random() * ROASTS.length);
  // 避免连续重复（最多重试5次）
  for(var t=0; t<5 && ROASTS[idx]===except; t++){
    idx = Math.floor(Math.random() * ROASTS.length);
  }
  return {text: ROASTS[idx], index: idx};
}

// 主流程
function showRoast(){
  var el = document.getElementById('roastText');
  var visitEl = document.getElementById('visitNum');
  var totalEl = document.getElementById('totalRoasts');

  // 访问计数（localStorage）
  var visits = parseInt(localStorage.getItem('prank_visits') || '0') + 1;
  localStorage.setItem('prank_visits', visits);
  visitEl.textContent = visits;

  // 保存上次的骂人话索引，避免重复
  var prevIdx = parseInt(localStorage.getItem('prank_last_idx') || '-1');
  var r;
  do {
    r = getRandomRoast();
  } while(r.index === prevIdx && ROASTS.length > 1);
  localStorage.setItem('prank_last_idx', r.index);

  // 决定字号
  var txt = r.text;
  el.className = 'roast-text';
  if(txt.length > 40) el.classList.add('small');
  else if(txt.length < 10) el.classList.add('large');

  // 打字机效果：先隐藏，再逐个显示
  el.textContent = '';
  el.style.opacity = '1';

  // 显示总数
  totalEl.textContent = totalRoasts;

  // 逐字出现效果
  var idx = 0;
  var chars = txt.split('');
  el.textContent = '';
  var timer = setInterval(function(){
    if(idx < chars.length){
      el.textContent += chars[idx];
      idx++;
    } else {
      clearInterval(timer);
    }
  }, 30 + (txt.length > 40 ? 15 : 25));

  // 第二次访问标记
  if(visits >= 2){
    document.getElementById('returnTag').classList.add('show');
  }
}

// 页面切换
function startPrank(){
  var fake = document.getElementById('stageFake');
  var main = document.getElementById('stageMain');
  var card = document.getElementById('prankCard');

  // 加载动画完成后切换
  setTimeout(function(){
    fake.style.opacity = '0';
    fake.style.transform = 'scale(0.95)';
    setTimeout(function(){
      fake.style.display = 'none';
      main.classList.add('show');
      // 闪屏效果
      document.body.classList.add('flash-bg');
      setTimeout(function(){
        document.body.classList.remove('flash-bg');
        card.classList.add('show');
        showRoast();
      }, 400);
    }, 400);
  }, 2200); // 等加载动画走完
}

// 重新加载（新骂人话）
function reloadPage(){
  var card = document.getElementById('prankCard');
  card.classList.remove('show');
  // 振动一下
  card.classList.add('shake');
  setTimeout(function(){
    card.classList.remove('shake');
    card.classList.add('show');
    showRoast();
  }, 300);
}

// 分享
function shareRoast(){
  if(navigator.share){
    navigator.share({
      title: '工作汇报',
      url: window.location.href
    }).catch(function(){});
  } else {
    // 复制链接
    var ta = document.createElement('textarea');
    ta.value = window.location.href;
    ta.style.position = 'fixed';
    ta.style.left = '-999px';
    document.body.appendChild(ta);
    ta.select();
    try{
      document.execCommand('copy');
      alert('✅ 链接已复制！去微信发给你的"好朋友"吧 😈');
    } catch(e){}
    document.body.removeChild(ta);
  }
}
