<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>查看文件</title>
<meta property="og:title" content="工作文档">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#000;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:'PingFang SC','Microsoft YaHei',sans-serif;
  padding:20px;
}
#roast{
  font-size:36px;
  font-weight:700;
  color:#ff4757;
  text-align:center;
  line-height:1.6;
  text-shadow:0 0 40px rgba(255,71,87,0.4);
  max-width:600px;
}
#roast.s{margin-top:60px}
#sub{
  color:#555;
  font-size:13px;
  text-align:center;
  margin-top:40px;
  letter-spacing:2px;
}
@media(max-width:480px){
  #roast{font-size:26px}
}
</style>
</head>
<body>
<div>
  <div id="roast"></div>
  <div id="sub"></div>
</div>
<script>

"你这个人，属于是"活着浪费空气，死了浪费墓地，不死不活浪费人民币"。",

"你活着就是给手机省电，因为没人找你聊天。",
"你搁这干啥呢？你妈知道你在外面这么丢人吗？",
"你这个操作，秀得我头皮发麻——是秀智商下限的那种。",
"但凡你有点自知之明，也不至于一点自知之明都没有。",
"你是什么品种的离谱？杂交的吧？",
"建议你原地出道，节目就叫《人类迷惑行为大赏》。",
"你这段话，把我 CPU 都干烧了。",
"你是懂离谱的——懂个屁。",
"本来想骂你的，但想想还是算了，毕竟狗咬我一口我不能咬回去。",
"汝之才华，堪比夜空中最暗的星——找都找不到。",
"阁下能有今日之成就，全靠脸皮厚。",
"君之愚钝，实乃天地造化之奇观。",
"你这种水平，连当反面教材都不够格。",

"你大概是女娲造人时甩出来的那坨泥点子。",
"你的存在，是对"人"这个字的侮辱。",
"智商这东西，你是真的一点都没有啊。",
"看见你我就放心了——原来这世上还有比我更无聊的人。",
"你点进来干嘛？指望看到什么好东西？你配吗？",
"你是不是觉得生活太无聊，想被人骂两句找找存在感？",
"你这个人吧，说你傻吧你还不承认，说你不傻吧你又干这事。",
"你的人生就像这个页面——你以为会有什么好东西，结果啥也没有。",
"如果傻人有傻福，那你应该已经福如东海了吧。",
"你的脑子就像 Excel——全是空表格，一个公式都没有。",

"你是真的狗。",
"离谱他妈给离谱开门——离谱到家了。",
"你搁这演我呢？",
"你没事吧？吃点溜溜梅。",
"退！退！退！",

"你的脸皮和你的智商成反比，而且比例高达 1:10000。",
"你就像冬天的雾霾——看不清、赶不走、还让人喘不过气。",
"你就像手机里的 1% 电量——明明什么用都没有了，还非要顽强地亮着那最后一下。",
"你这个人，放在简历上就是"精通吃喝玩乐"——还玩不明白的那种。",
"你的存在感，比我钱包里的钱还少。",

"你就像网页上的 404——除了让人无语，没有任何价值。",
"你要是在游戏里，就是那种连人机都打不过的队友。",
"给狗扔根骨头它都知道摇尾巴，给你发条消息你都不知道回什么。",
"建议你回炉重造，出厂设置太拉胯了。",
"你这种人去面试，面试官都会问：你是来搞笑的吗？",
"你就像那首歌唱的——你算什么男人/女人——不对，你算什么。"

var prev = localStorage.getItem('pr_last');
var idx;
do{idx=Math.floor(Math.random()*R.length)}while(idx==prev&&R.length>1);
localStorage.setItem('pr_last',idx);
document.getElementById('roast').textContent=R[idx];
document.getElementById('sub').textContent='—— 来自神秘人的问候 · 第'+(parseInt(localStorage.getItem('pr_cnt')||'0')+1)+'次';
localStorage.setItem('pr_cnt',parseInt(localStorage.getItem('pr_cnt')||'0')+1);
// 防退
window.onbeforeunload=function(){return'确定要走？'};
document.title='🤬 你再说一遍？';
setInterval(function(){document.title=['🤬 你骂谁呢','😤 你再说一遍','💢 你是不是找骂','👿 你还敢回来'][Math.floor(Math.random()*4)]},2000);
</script>
</body>
</html>
